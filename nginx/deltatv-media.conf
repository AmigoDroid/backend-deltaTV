# Incluir DENTRO do server HTTPS de api.deltatv.com.br.
# No location que já envia requisições ao Node, adicionar também:
#   proxy_set_header X-Delta-Media-Gateway deltatv-media-v1;
# O backend deve continuar acessível apenas no loopback/rede privada.

location = /_deltatv_media {
    internal;
    # Capturar somente cabeçalhos da resposta do Node autorizado.
    set $delta_media_target $upstream_http_x_delta_origin_target;
    set $delta_media_host $upstream_http_x_delta_origin_host;
    set $delta_media_tls_name $upstream_http_x_delta_origin_tls_name;
    set $delta_media_ua $upstream_http_x_delta_origin_ua;
    set $delta_media_cors $upstream_http_access_control_allow_origin;
    if ($delta_media_target = "") { return 502; }

    # IP já resolvido e validado pelo Node. Não há nova resolução DNS aqui.
    proxy_pass $delta_media_target;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $delta_media_host;
    proxy_set_header User-Agent $delta_media_ua;
    proxy_set_header Accept "*/*";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_ssl_name $delta_media_tls_name;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 5;
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_next_upstream off;

    # A origem não pode executar X-Accel nem enviar o navegador ao HTTP.
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering Expires Cache-Control Set-Cookie Vary;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 =502 @delta_media_redirect_changed;
    proxy_redirect off;
    proxy_hide_header Location;
    proxy_hide_header Refresh;
    proxy_hide_header Content-Location;
    proxy_hide_header Link;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header X-Delta-Origin-Target;
    proxy_hide_header X-Delta-Origin-Host;
    proxy_hide_header X-Delta-Origin-TLS-Name;
    proxy_hide_header X-Delta-Origin-UA;
    add_header Access-Control-Allow-Origin $delta_media_cors always;
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, X-Delta-Media-Transport" always;
    add_header X-Delta-Media-Transport nginx always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;
    # Não registrar URLs da origem ou cabeçalhos com credenciais.
    access_log off;
    error_log /var/log/nginx/deltatv-media-error.log crit;
}

location @delta_media_redirect_changed {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin $delta_media_cors always;
    return 502 '{"code":"ORIGIN_REDIRECT_CHANGED","message":"A origem mudou o destino durante a abertura. Atualize a reprodução."}';
}

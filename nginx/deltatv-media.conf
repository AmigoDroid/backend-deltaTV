# Incluir DENTRO do server HTTPS da API, junto do location / existente.
# Não exponha a porta Node na Internet. Origem fixada/validada pelo backend.
location = /_deltatv_media {
    internal;
    # Preserva cabeçalhos antes de proxy_pass reinicializar o upstream.
    set $delta_target $upstream_http_x_delta_origin_target;
    set $delta_host $upstream_http_x_delta_origin_host;
    set $delta_tls $upstream_http_x_delta_origin_tls_name;
    set $delta_ua $upstream_http_x_delta_origin_ua;
    proxy_pass $delta_target;
    proxy_set_header Host $delta_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $delta_tls;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header User-Agent $delta_ua;
    proxy_set_header Accept "*/*";
    proxy_set_header Accept-Encoding "identity";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    proxy_pass_request_headers off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 180s;
    proxy_connect_timeout 15s;
    proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering X-Accel-Limit-Rate;
    proxy_hide_header Location;
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Accel-Redirect;
    proxy_intercept_errors on;
    # HEAD de resolução e GET real podem receber destinos diferentes.
    # Reabre a requisição ORIGINAL via Node: segue/valida cada salto e reescreve HLS.
    error_page 301 302 303 307 308 = @delta_media_node;
    add_header X-Delta-Media-Transport nginx always;
    add_header Cache-Control no-store always;
}

location @delta_media_node {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Delta-Media-Gateway deltatv-media-v1;
    proxy_set_header X-Delta-Media-Fallback deltatv-node-v1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_hide_header X-Delta-Origin-Target;
    proxy_hide_header X-Delta-Origin-Host;
    proxy_hide_header X-Delta-Origin-TLS-Name;
    proxy_hide_header X-Delta-Origin-UA;
    add_header X-Delta-Media-Transport node-fallback always;
}

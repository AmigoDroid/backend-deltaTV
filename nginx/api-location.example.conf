# REFERÊNCIA: adaptar o location / existente; não duplicá-lo.
# No server HTTPS existente manter certificados e adicionar, se ausentes:
# listen 443 ssl;
# listen [::]:443 ssl;
# include /etc/nginx/snippets/deltatv-media.conf;
# Manter os locations WebSocket /ws e outras regras já existentes.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header X-Delta-Media-Gateway deltatv-media-v1;
    # Sobrescreve qualquer tentativa do cliente de injetar o marcador interno.
    proxy_set_header X-Delta-Media-Fallback "";
    proxy_hide_header X-Delta-Origin-Target;
    proxy_hide_header X-Delta-Origin-Host;
    proxy_hide_header X-Delta-Origin-TLS-Name;
    proxy_hide_header X-Delta-Origin-UA;
    proxy_buffering off;
    proxy_read_timeout 180s;
}

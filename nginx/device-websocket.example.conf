# Adicionar dentro do server HTTPS de api.deltatv.com.br.
# NAO substitui /ws existente dos paineis. Necessario para Roku OS 16+.
# NUNCA publicar uma rota ws:// em texto puro para transportar tokens.
location = /ws/device {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
# Mantenha o location / existente com proxy_http_version 1.1 e
# proxy_read_timeout >= 55s para /api/v1/client/heartbeat/realtime/poll.
